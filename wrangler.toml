name = "garten-floridsdorf"
main = "worker/index.ts"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "garten-floridsdorf"
database_id = "482df2b9-2920-45da-8d1a-59d3c380f36f"
migrations_dir = "drizzle"

# R2 bucket for event attachments. Local dev runs against a MinIO-compatible
# R2 dev server (`wrangler r2 object`); production uses a real R2 bucket.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "garten-floridsdorf-attachments"
preview_bucket_name = "garten-floridsdorf-attachments-preview"

# Outbound transactional mail is delivered through the `smtprelay`
# container running on our own mailserver (see docs/smtp-relay.md).
# The Worker POSTs to `${SMTP_RELAY_URL}/send` and authenticates
# with the shared `SMTP_RELAY_TOKEN` (sent as `X-SMTP-Token`).
# Workers can't open raw TCP, so this relay bridges HTTPS → SMTP.
