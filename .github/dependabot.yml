version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:10"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "automated"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
